    <!-- Left Building Windows -->
    <rect x="174" y="142" width="6" height="6" rx="1" />
    <rect x="186" y="142" width="6" height="6" rx="1" />
    <polygon points="199,138 202,144 196,144" />
    
    <rect x="174" y="154" width="6" height="6" rx="1" />
    <rect x="186" y="154" width="6" height="6" rx="1" />
    <rect x="198" y="154" width="6" height="6" rx="1" />
    <rect x="210" y="154" width="6" height="6" rx="1" />

    <rect x="174" y="166" width="6" height="6" rx="1" />
    <rect x="186" y="166" width="6" height="6" rx="1" />
    <rect x="198" y="166" width="6" height="6" rx="1" />
    <rect x="210" y="166" width="6" height="6" rx="1" />

    <rect x="174" y="178" width="6" height="6" rx="1" />
    <rect x="186" y="178" width="6" height="6" rx="1" />
    <rect x="198" y="178" width="6" height="6" rx="1" />
    <rect x="210" y="178" width="6" height="6" rx="1" />

    <!-- Right Building Windows -->
    <rect x="284" y="154" width="6" height="6" rx="1" />
    <rect x="296" y="154" width="6" height="6" rx="1" />
    <rect x="308" y="154" width="6" height="6" rx="1" />
    <rect x="320" y="154" width="6" height="6" rx="1" />

    <rect x="284" y="166" width="6" height="6" rx="1" />
    <rect x="296" y="166" width="6" height="6" rx="1" />
    <rect x="308" y="166" width="6" height="6" rx="1" />
    <rect x="320" y="166" width="6" height="6" rx="1" />

    <rect x="284" y="178" width="6" height="6" rx="1" />
    <rect x="296" y="178" width="6" height="6" rx="1" />
    <rect x="308" y="178" width="6" height="6" rx="1" />
    <rect x="320" y="178" width="6" height="6" rx="1" />

    <!-- Flower/Sun Motif -->
    <circle cx="295" cy="140" r="5" fill="none" stroke="#C59B27" stroke-width="2" />
    <circle cx="295" cy="140" r="2" fill="#C59B27" />


  <!-- Fork Icon (Navy) -->
  <path fill="#1C355E" d="
    M228,100 h8 v35 c0,10 7,18 14,18 h0 c7,0 14,-8 14,-18 v-35 h8 v35 c0,15 -10,26 -22,28 v22 c0,5 -2,9 -2,9 h-8 c0,0 -2,-4 -2,-9 v-22 c-12,-2 -22,-13 -22,-28 v-35 z
    M239,100 h5 v28 h-5 z
    M256,100 h5 v28 h-5 z
  " />

  <!-- Typography -->
  <!-- Cater Sync -->
  <text x="250" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="600" fill="#1C355E">CaterSync</text>

  <!-- BY PG's -->
  <text x="250" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#C59B27" letter-spacing="2">BY PG’s</text>

  <!-- CATERING -->
  <text x="250" y="360" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1C355E" letter-spacing="8">CATERING</text>

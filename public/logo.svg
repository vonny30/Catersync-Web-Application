<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />
  
  <!-- Outer Navy Border -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#1C355E" stroke-width="8" />
  
  <!-- Inner Gold Border -->
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59B27" stroke-width="4" />

  <!-- City Skyline Pattern (Gold) -->
